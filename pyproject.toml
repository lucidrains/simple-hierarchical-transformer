[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-hierarchical-transformer"
version = "0.3.0"
description = "Simple Hierarchical Transformer"
authors = [
  { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
keywords = [
  "artificial intelligence",
  "deep learning",
  "transformers",
  "attention mechanism",
  "hierarchical"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
]
dependencies = [
  "accelerate",
  "einops>=0.7.0",
  "local-attention",
  "torch>=2.0",
  "torch-einops-utils"
]

[project.urls]
Homepage = "https://github.com/lucidrains/simple-hierarchical-transformer"

[tool.hatch.build.targets.wheel]
packages = ["simple_hierarchical_transformer"]

[tool.hatch.build.targets.sdist]
include = [
    "simple_hierarchical_transformer",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
